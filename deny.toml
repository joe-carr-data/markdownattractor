[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `paste` is unmaintained (macro crate, transitive through the search-layer deps of ADR-0004).
    # Not a vulnerability; revisit when its dependents move to `pastey`.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro crate pulled in transitively; no vulnerability" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0", # webpki-root-certs (Mozilla CA bundle data)
    "0BSD",                # interprocess and its recvmsg/doctest-file deps (ADR-0003)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # we never want a second async runtime or a second TLS stack sneaking in
    { crate = "async-std", reason = "tokio is the only runtime" },
    { crate = "openssl", reason = "no OpenSSL; rustls only if TLS is ever needed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "mda-core"
description = "markdownattractor engine: markdown parsing, section diffing, summarization pipeline, store and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["embeddings"]
# Local embeddings through fastembed + a statically linked ONNX Runtime (ADR-0004). Off, the
# binary builds on targets without prebuilt ONNX binaries (Intel macOS) and search is lexical.
embeddings = ["dep:fastembed"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
schemars.workspace = true
comrak.workspace = true
blake3.workspace = true
toml.workspace = true
ignore.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
notify.workspace = true       # ADR-0003
interprocess.workspace = true # ADR-0003
fastembed = { workspace = true, optional = true } # ADR-0004, feature `embeddings`
rmcp.workspace = true         # ADR-0004

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

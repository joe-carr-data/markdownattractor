[package]
name = "mda-cli"
description = "markdownattractor: a time-aware, searchable knowledge layer over your markdown, for Claude Code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "mda"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mda-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true # ADR-0003: daemon log file
tempfile.workspace = true         # mda eval indexes the golden corpus in a private temp root

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true # ADR-0003 amendment: make std handles non-inheritable before spawning the daemon

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] } # MCP end-to-end test
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true

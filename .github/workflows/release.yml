name: Release

# Five archives + SHA256SUMS on a GitHub Release, exactly as scripts/bootstrap.sh downloads them
# (ADR-0005).
#
# The way to release: run this workflow on `main` with `publish` ticked
# (`gh workflow run Release --ref main -f publish=true`). It builds once, runs the install
# check, and only then creates the tag `v<VERSION>` and the release on the commit it built: a
# failed check publishes nothing and leaves no tag. Runs on `main` share one compile cache.
#
# Without `publish` it is a dry run (artifacts stay on the workflow run). A pushed tag `vX.Y.Z`
# still builds and publishes, as before.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the tag v<VERSION> and publish the release (main only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  version:
    name: version agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, plugin.json, marketplace.json and Cargo.toml agree (and the tag, when there is one)
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then scripts/dev/check-version.sh "${{ github.ref_name }}"; else scripts/dev/check-version.sh; fi
      - name: a publishing run is on main, and its version is not released yet
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = refs/heads/main ] || { echo "publish runs on main only, not ${{ github.ref }}" >&2; exit 1; }
          v="v$(tr -d '[:space:]' < VERSION)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$v")" ]; then echo "tag $v already exists" >&2; exit 1; fi
          if gh release view "$v" >/dev/null 2>&1; then echo "release $v already exists" >&2; exit 1; fi

  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
            bin: mda
          # ONNX Runtime ships no prebuilt binaries for Intel macOS: lexical-only build.
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            features: "--no-default-features"
            bin: mda
          # 24.04: the prebuilt static ONNX Runtime needs the libstdc++ of GCC 13 (22.04 has 11:
          # `__cxa_call_terminate` undefined at link time on arm64).
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: ""
            bin: mda
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
            bin: mda
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            bin: mda.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml pins the toolchain cargo actually uses; add the target to that one.
      - name: add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          # One cache, written from main: a branch's or a tag's cache is visible to no other run.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build
        run: cargo build --release -p mda-cli --target ${{ matrix.target }} ${{ matrix.features }}
      - name: smoke test
        if: matrix.name != 'darwin-x64'
        shell: bash
        run: |
          target/${{ matrix.target }}/release/${{ matrix.bin }} --version
          target/${{ matrix.target }}/release/${{ matrix.bin }} --version | grep -q "$(tr -d '[:space:]' < VERSION)"
      - name: sign and notarise (macOS, only when the Apple secrets exist)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/dev/notarize-macos.sh "target/${{ matrix.target }}/release/mda"
      - name: pack
        shell: bash
        run: |
          set -euo pipefail
          out="mda-${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$out/"
          cp LICENSE README.md "dist/$out/"
          # The binary sits at the archive root: that is what bootstrap.sh extracts.
          tar -C "dist/$out" -czf "dist/$out.tar.gz" .
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mda-${{ matrix.name }}
          path: dist/mda-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # The MCP bundle (ADR-0012): every build plus a launcher that picks the one for the machine,
  # validated and packed with the MCPB tool. Its URL must contain "mcp" for the MCP Registry.
  bundle:
    name: MCP bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mda-*
          merge-multiple: true
      - name: lay out the bundle
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          b="$RUNNER_TEMP/bundle"
          mkdir -p "$b/server"
          for n in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "$RUNNER_TEMP/x/$n"
            tar -xzf "dist/mda-$n.tar.gz" -C "$RUNNER_TEMP/x/$n"
            install -m 0755 "$RUNNER_TEMP/x/$n/mda" "$b/server/mda-$n"
          done
          mkdir -p "$RUNNER_TEMP/x/windows-x64"
          tar -xzf dist/mda-windows-x64.tar.gz -C "$RUNNER_TEMP/x/windows-x64"
          install -m 0755 "$RUNNER_TEMP/x/windows-x64/mda.exe" "$b/server/mda.exe"
          install -m 0755 packaging/mcpb/mda-launch "$b/server/mda-launch"
          cp LICENSE "$b/"
          jq --arg v "$v" '.version = $v' packaging/mcpb/manifest.json > "$b/manifest.json"
          echo "BUNDLE_DIR=$b" >> "$GITHUB_ENV"
          echo "BUNDLE_FILE=markdownattractor-mcp-$v.mcpb" >> "$GITHUB_ENV"
      - name: validate and pack (MCPB CLI, pinned)
        run: |
          set -euo pipefail
          mkdir -p out
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$BUNDLE_DIR/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$BUNDLE_DIR" "out/$BUNDLE_FILE"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: out/*.mcpb
          if-no-files-found: error

  publish:
    name: checksums and release
    needs: [build, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum mda-*.tar.gz markdownattractor-mcp-*.mcpb > SHA256SUMS
          cat SHA256SUMS
      - name: bootstrap.sh installs the linux-x64 archive from this layout
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/markdownattractor-plugin-data
        run: |
          set -euo pipefail
          # Serve dist/ the way GitHub Releases would, then point the hook at it.
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          sleep 1
          sed "s|https://github.com/\$REPO/releases/download/v\${WANTED}|http://127.0.0.1:8765|" scripts/bootstrap.sh > /tmp/bootstrap-local.sh
          bash /tmp/bootstrap-local.sh
          v="$(tr -d '[:space:]' < VERSION)"
          "$CLAUDE_PLUGIN_DATA/bin/mda-$v" --version | grep -q "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/mda-*.tar.gz dist/markdownattractor-mcp-*.mcpb dist/SHA256SUMS \
            --title "${{ github.ref_name }}" --generate-notes --verify-tag
      - name: create the tag and publish the GitHub Release (a publishing run on main)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="v$(tr -d '[:space:]' < VERSION)"
          # The tag is created here, on the commit that was built and checked. A tag made with
          # the workflow's token starts no second run.
          gh release create "$v" dist/mda-*.tar.gz dist/markdownattractor-mcp-*.mcpb dist/SHA256SUMS \
            --target "${{ github.sha }}" --title "$v" --generate-notes

  # The MCP Registry entry (ADR-0012), after the release is live, on publishing runs only.
  # GitHub OIDC proves the io.github.joe-carr-data namespace: no stored token.
  registry:
    name: MCP Registry
    needs: publish
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: out
      - name: mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json for this release
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          f="markdownattractor-mcp-$v.mcpb"
          sha="$(sha256sum "out/$f" | awk '{print $1}')"
          url="https://github.com/${{ github.repository }}/releases/download/v$v/$f"
          curl -fsSIL -o /dev/null "$url"   # the asset is live before the registry points at it
          jq --arg v "$v" --arg url "$url" --arg sha "$sha" \
            '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.release.json
          cat server.release.json
      - name: publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          cp server.release.json server.json
          ./mcp-publisher publish

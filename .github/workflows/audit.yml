name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write # the action posts its result as a check run

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # paste is unmaintained (transitive via tokenizers); tracked in deny.toml with a reason.
          ignore: RUSTSEC-2024-0436
